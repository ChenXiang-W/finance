<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 — 金融欺诈智能检测系统</title>
  <!-- Vue2 + Element UI -->
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="admin-app">
  <!-- ======== 登录页 ======== -->
  <div v-if="!loggedIn" class="admin-login">
    <div class="login-card">
      <div class="login-hex">
        <svg width="44" height="48" viewBox="0 0 44 48" fill="none">
          <polygon points="22,2 40,12 40,34 22,44 4,34 4,12" stroke="#4f6ef7" stroke-width="1.2" fill="none"/>
          <circle cx="22" cy="23" r="4" fill="#4f6ef7" opacity="0.8"/>
        </svg>
      </div>
      <h1>管理后台</h1>
      <p>金融欺诈智能检测系统</p>
      <el-form :model="loginForm" :rules="loginRules" ref="loginFormRef" @submit.native.prevent="doLogin">
        <el-form-item prop="username">
          <el-input v-model="loginForm.username" placeholder="用户名" prefix-icon="el-icon-user"></el-input>
        </el-form-item>
        <el-form-item prop="password">
          <el-input v-model="loginForm.password" type="password" placeholder="密码" prefix-icon="el-icon-lock" @keyup.enter.native="doLogin"></el-input>
        </el-form-item>
        <el-button type="primary" :loading="loginLoading" @click="doLogin" class="login-btn">
          登 录
        </el-button>
      </el-form>
      <p v-if="loginError" class="login-error">{{ loginError }}</p>
    </div>
  </div>

  <!-- ======== 主布局 ======== -->
  <div v-else class="admin-layout">
    <!-- 侧边栏 -->
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <span class="brand-dot"></span> FRAUD ADMIN
      </div>
      <nav class="sidebar-nav">
        <a v-for="m in menu" :key="m.key" :class="{ active: currentView === m.key }"
           @click="currentView = m.key">
          <span class="nav-icon">{{ m.icon }}</span> {{ m.label }}
        </a>
      </nav>
      <div class="sidebar-footer">
        <span>{{ adminUser }}</span>
        <a @click="logout" class="logout-link">退出</a>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="admin-main">
      <!-- 顶栏 -->
      <header class="admin-topbar">
        <h2>{{ currentTitle }}</h2>
        <div class="topbar-actions">
          <span class="topbar-time">{{ now }}</span>
          <el-tag size="small" type="success">SYS.ONLINE</el-tag>
        </div>
      </header>

      <!-- ====== 统计面板 ====== -->
      <section v-if="currentView === 'dashboard'" class="view-dashboard">
        <div class="stat-grid">
          <div class="stat-card" v-for="s in statsCards" :key="s.label">
            <span class="stat-num" :style="{color:s.color}">{{ s.value }}</span>
            <span class="stat-label">{{ s.label }}</span>
          </div>
        </div>
      </section>

      <!-- ====== 案例管理 ====== -->
      <section v-if="currentView === 'cases'" class="view-cases">
        <div class="toolbar">
          <el-input v-model="caseSearch" placeholder="搜索案例内容…" size="small" style="width:240px" clearable @clear="loadCases" @keyup.enter.native="loadCases"></el-input>
          <el-select v-model="caseFilterType" size="small" placeholder="欺诈类型" clearable style="width:150px" @change="loadCases">
            <el-option label="冒充客服" value="冒充客服"></el-option>
            <el-option label="虚假投资" value="虚假投资"></el-option>
            <el-option label="冒充公检法" value="冒充公检法"></el-option>
            <el-option label="信贷诈骗" value="信贷诈骗"></el-option>
            <el-option label="正常" value="正常"></el-option>
          </el-select>
          <el-button type="primary" size="small" icon="el-icon-plus" @click="openCaseDialog()">新增案例</el-button>
          <el-button size="small" icon="el-icon-refresh" @click="loadCases">刷新</el-button>
        </div>
        <el-table :data="cases" stripe style="width:100%" v-loading="caseLoading" size="small">
          <el-table-column prop="id" label="ID" width="70"></el-table-column>
          <el-table-column prop="text" label="文本内容" min-width="280" show-overflow-tooltip></el-table-column>
          <el-table-column prop="fraud_type" label="类型" width="110">
            <template slot-scope="s"><el-tag :type="typeTag(s.row.fraud_type)" size="mini">{{ s.row.fraud_type }}</el-tag></template>
          </el-table-column>
          <el-table-column prop="risk_level" label="风险等级" width="100">
            <template slot-scope="s"><el-tag :type="levelTag(s.row.risk_level)" size="mini">{{ s.row.risk_level }}</el-tag></template>
          </el-table-column>
          <el-table-column prop="risk_score" label="评分" width="70"></el-table-column>
          <el-table-column prop="is_active" label="启用" width="60">
            <template slot-scope="s"><span :style="{color:s.row.is_active?'#00ff66':'#ff4444'}">{{ s.row.is_active ? '✓' : '✗' }}</span></template>
          </el-table-column>
          <el-table-column label="操作" width="160" fixed="right">
            <template slot-scope="s">
              <el-button type="text" size="mini" @click="openCaseDialog(s.row)">编辑</el-button>
              <el-button type="text" size="mini" style="color:#ff4444" @click="deleteCase(s.row.id)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>
        <el-pagination style="margin-top:16px;text-align:right" background
          :current-page="casePage" :page-size="20" :total="caseTotal"
          layout="total, prev, pager, next" @current-change="loadCases">
        </el-pagination>

        <!-- 新增/编辑弹窗 -->
        <el-dialog :title="caseDialogTitle" :visible.sync="caseDialogVisible" width="640px" top="5vh">
          <el-form :model="caseForm" label-width="80px" size="small">
            <el-form-item label="文本内容">
              <el-input v-model="caseForm.text" type="textarea" rows="4"></el-input>
            </el-form-item>
            <el-form-item label="欺诈类型">
              <el-select v-model="caseForm.fraud_type" style="width:100%">
                <el-option label="冒充客服" value="冒充客服"></el-option>
                <el-option label="虚假投资" value="虚假投资"></el-option>
                <el-option label="冒充公检法" value="冒充公检法"></el-option>
                <el-option label="信贷诈骗" value="信贷诈骗"></el-option>
                <el-option label="正常" value="正常"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item label="风险等级">
              <el-select v-model="caseForm.risk_level" style="width:100%">
                <el-option label="低风险" value="low"></el-option>
                <el-option label="中风险" value="medium"></el-option>
                <el-option label="高风险" value="high"></el-option>
                <el-option label="极高风险" value="critical"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item label="风险评分">
              <el-input-number v-model="caseForm.risk_score" :min="0" :max="1" :step="0.01"></el-input-number>
            </el-form-item>
            <el-form-item label="分析标注">
              <el-input v-model="caseForm.analysis" type="textarea" rows="3"></el-input>
            </el-form-item>
            <el-form-item label="标签">
              <el-input v-model="caseForm.tags" placeholder="逗号分隔"></el-input>
            </el-form-item>
            <el-form-item label="启用训练">
              <el-switch v-model="caseForm.is_active"></el-switch>
            </el-form-item>
          </el-form>
          <span slot="footer">
            <el-button @click="caseDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="saveCase" :loading="caseSaving">保存</el-button>
          </span>
        </el-dialog>
      </section>

      <!-- ====== 用户管理 ====== -->
      <section v-if="currentView === 'users'" class="view-users">
        <div class="toolbar">
          <el-button size="small" icon="el-icon-refresh" @click="loadUsers">刷新</el-button>
        </div>
        <el-table :data="users" stripe v-loading="userLoading" size="small">
          <el-table-column prop="id" label="ID" width="70"></el-table-column>
          <el-table-column prop="username" label="用户名" width="140"></el-table-column>
          <el-table-column prop="email" label="邮箱" min-width="200"></el-table-column>
          <el-table-column prop="role" label="角色" width="100">
            <template slot-scope="s">
              <el-tag :type="s.row.role==='banned'?'danger':s.row.role==='analyst'?'success':'info'" size="mini">{{ s.row.role }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="login_count" label="登录次数" width="90"></el-table-column>
          <el-table-column prop="created_at" label="注册时间" width="170">
            <template slot-scope="s">{{ formatTime(s.row.created_at) }}</template>
          </el-table-column>
          <el-table-column label="操作" width="140">
            <template slot-scope="s">
              <el-button type="text" size="mini" @click="openUserDialog(s.row)">编辑</el-button>
              <el-button type="text" size="mini" style="color:#ff4444" @click="deleteUser(s.row.id)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>
        <el-pagination style="margin-top:16px;text-align:right" background
          :current-page="userPage" :page-size="20" :total="userTotal"
          layout="total, prev, pager, next" @current-change="loadUsers">
        </el-pagination>

        <!-- 编辑用户弹窗 -->
        <el-dialog title="编辑用户" :visible.sync="userDialogVisible" width="480px">
          <el-form :model="userForm" label-width="80px" size="small">
            <el-form-item label="用户名"><el-input v-model="userForm.username"></el-input></el-form-item>
            <el-form-item label="邮箱"><el-input v-model="userForm.email"></el-input></el-form-item>
            <el-form-item label="角色">
              <el-select v-model="userForm.role" style="width:100%">
                <el-option label="分析师" value="analyst"></el-option>
                <el-option label="观察者" value="viewer"></el-option>
                <el-option label="封禁" value="banned"></el-option>
              </el-select>
            </el-form-item>
          </el-form>
          <span slot="footer">
            <el-button @click="userDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="saveUser" :loading="userSaving">保存</el-button>
          </span>
        </el-dialog>
      </section>

      <!-- ====== 检测日志 ====== -->
      <section v-if="currentView === 'logs'" class="view-logs">
        <el-table :data="logs" stripe v-loading="logLoading" size="small">
          <el-table-column prop="id" label="ID" width="70"></el-table-column>
          <el-table-column prop="input_text" label="输入文本" min-width="250" show-overflow-tooltip></el-table-column>
          <el-table-column prop="risk_score" label="评分" width="70"></el-table-column>
          <el-table-column prop="risk_level" label="等级" width="90"></el-table-column>
          <el-table-column prop="fraud_type" label="类型" width="100"></el-table-column>
          <el-table-column prop="model_used" label="模型" width="100"></el-table-column>
          <el-table-column prop="latency_ms" label="耗时" width="80">
            <template slot-scope="s">{{ s.row.latency_ms }}ms</template>
          </el-table-column>
          <el-table-column prop="created_at" label="时间" width="170">
            <template slot-scope="s">{{ formatTime(s.row.created_at) }}</template>
          </el-table-column>
        </el-table>
        <el-pagination style="margin-top:16px;text-align:right" background
          :current-page="logPage" :page-size="20" :total="logTotal"
          layout="total, prev, pager, next" @current-change="loadLogs">
        </el-pagination>
      </section>
    </main>
  </div>
</div>

<script src="https://unpkg.com/vue@2.7.14/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
